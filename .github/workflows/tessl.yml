# Skill quality: lint, a Tessl review (fails under the threshold) and the eval scenarios in
# skills/actions-to-issues/evals (an agent with and without the skill; scores go to the job summary, they do not gate).
# Needs the TESSL_TOKEN secret and TESSL_WORKSPACE variable. Without them, and on fork or Dependabot PRs (no secrets),
# the job passes with a notice having run nothing: do not make this check required until it is configured.
name: tessl

on:
  pull_request:
    paths:
      - "skills/actions-to-issues/**"
      - ".github/workflows/tessl.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tessl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  skill:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      WORKSPACE: ${{ vars.TESSL_WORKSPACE }}
      REVIEW_THRESHOLD: ${{ vars.TESSL_REVIEW_THRESHOLD || '80' }}
      EVAL_AGENT: ${{ vars.TESSL_EVAL_AGENT }}
      EVAL_MODEL: ${{ vars.TESSL_EVAL_MODEL }}
    steps:
      - name: Check Tessl is configured
        id: cfg
        env:
          TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
        run: |
          if [ -z "$TESSL_TOKEN" ] || [ -z "$WORKSPACE" ]; then
            echo "::notice::Tessl skipped: set the TESSL_TOKEN secret and the TESSL_WORKSPACE variable (not available on fork PRs)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.cfg.outputs.run == 'true'
        uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}
      - name: Lint
        if: steps.cfg.outputs.run == 'true'
        run: tessl skill lint ./skills/actions-to-issues
      - name: Review (fails under the threshold)
        if: steps.cfg.outputs.run == 'true'
        env:
          TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
        run: tessl review run ./skills/actions-to-issues --workspace "$WORKSPACE" --json --threshold "$REVIEW_THRESHOLD"
      - name: Evals (agent with and without the skill)
        if: steps.cfg.outputs.run == 'true'
        env:
          TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
        run: |
          args=(--wait --label "pr-${{ github.event.pull_request.number || github.run_id }}")
          [ -n "$EVAL_AGENT" ] && args+=(--agent "$EVAL_AGENT")
          [ -n "$EVAL_MODEL" ] && args+=(--model "$EVAL_MODEL")
          tessl eval run ./skills/actions-to-issues "${args[@]}" | tee eval-run.log
          # `eval view --last` finds nothing in CI, so read the run id from the "eval-runs/<id>" link instead.
          run_id="$(grep -oE 'eval-runs/[0-9a-f-]{36}' eval-run.log | head -1 | cut -d/ -f2)"
          [ -n "$run_id" ] || { echo "::error::No eval run id in the output"; exit 1; }
          {
            echo "## Tessl evals"
            echo '```'
            tessl eval view "$run_id"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
