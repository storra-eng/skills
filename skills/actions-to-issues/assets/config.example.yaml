# Copy to a private location, fill in, and point MN2L_CONFIG at it. Never commit your real copy.
# Everything here is yours to supply: the skill hardcodes no team, project, label or person.

source: granola             # granola | fireflies | fathom; absent means granola. Instructions: references/source-<source>.md
                            # (the pre-check needs the same value: --source or MN2L_SOURCE)
# fathom:                   # only with source: fathom - its MCP tool names are undocumented (references/source-fathom.md)
#   tools: {list: "...", summary: "...", transcript: "..."}
tracker: linear             # linear | jira | github; absent means linear. Instructions: references/tracker-<tracker>.md

linear:
  team: "ENG"                # team key the issues are filed under
  projects:                  # the only projects a card may name; ids are what the write call gets
    - name: "Platform"
      id: "00000000-0000-4000-8000-0000000000a1"
      use_for: "backend, infrastructure, data pipeline work"
    - name: "Web app"
      id: "00000000-0000-4000-8000-0000000000a2"
      use_for: "customer-facing web UI work"
  labels:                    # the only labels a card may use
    - name: "bug"
      id: "00000000-0000-4000-8000-0000000000b1"
    - name: "feature"
      id: "00000000-0000-4000-8000-0000000000b2"
    - name: "chore"
      id: "00000000-0000-4000-8000-0000000000b3"
  people:                    # assignee only if the meeting named them; match on name or alias
    - name: "Alex Example"
      id: "00000000-0000-4000-8000-0000000000c1"
      aliases: ["Alex"]
  default_assignee: null     # keep null: assign only people the meeting named

# Only the block named by `tracker` is read. Fields per tracker are in references/tracker-<tracker>.md.
# jira:
#   cloud_id: "00000000-0000-4000-8000-0000000000d1"
#   projects: [{key: "ENG", name: "Engineering", use_for: "backend and infrastructure"}]
#   issue_types: ["Task", "Bug"]
#   components: [{name: "Billing", id: "10001", project: "ENG"}]
#   labels: ["meeting-action"]
#   priorities: ["Highest", "High", "Medium", "Low"]
#   people: [{name: "Alex Example", account_id: "000000:00000000-0000-4000-8000-0000000000c1", aliases: ["Alex"]}]
#   default_assignee: null
# github:
#   repos: [{owner: "example-org", name: "web", use_for: "customer-facing web UI"}]
#   labels: ["bug", "feature", "chore"]
#   milestones: [{title: "Launch", number: 3, repo: "example-org/web"}]
#   people: [{name: "Alex Example", login: "alex-example", aliases: ["Alex"]}]
#   default_assignee: null

scope:
  company_participant_domains: ["example.com"]
  out_of_scope_topics:
    - medical
    - financial-personal
    - legal-personal
    - family
    - recruitment-of-a-named-individual
  skip_workspace_hidden: true   # Granola only: skip is_workspace_visible="false" unless unmistakably company work

limits:                      # caps bound the damage of a manipulated run
  max_cards_per_meeting: 3
  max_cards_per_run: 8

issue:
  # Link back to the meeting: Granola only. Fireflies and Fathom links ride on the card's Source line instead
  # (references/card-and-issue-format.md); this template is never used for them.
  link_template: "https://notes.granola.ai/d/{meeting_id}"
  source_links: true          # false: no meeting link on any card or issue, from any source (e.g. a public repository)
  # {approval_id} is supplied by the host with each approved card (the card id if the host has no approval id).
  attribution_template: "Filed by the meeting-notes assistant from {meeting_title}, {date}. Approval: {approval_id}."
  language: "en"             # write cards and issues in this language (e.g. en-GB, en-US)

approval:
  # Informational for the agent: where cards go. The approval itself is enforced by the host,
  # not by anything written here.
  channel: "#meeting-approvals"
