# Install once per clone (worktrees share it): `pre-commit install`
# Stdlib-only hooks live in scripts/; add language-specific hooks below as the repo grows.
repos:
  # Blocks new or growing files over 5,000 tokens. Shared hook (STO-1145); exemptions go in .token-budget-exempt.
  - repo: https://github.com/storra-eng/file-token-budget
    rev: v1.0.0
    hooks:
      - id: file-token-budget
